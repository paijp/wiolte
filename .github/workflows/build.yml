name: build

on:
  push:
    paths-ignore: ['rel/**']
  pull_request:
  workflow_dispatch:

jobs:
  bootloader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: make -C bootloader
      - uses: actions/upload-artifact@v4
        with:
          name: bootloader
          path: bootloader/bootloader.bin

  sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://www.seeed.co.jp/package_SeeedJP_index.json
          arduino-cli core update-index
          arduino-cli core install SeeedJP:Seeed_STM32F4
          arduino-cli lib install "Wio LTE for Arduino"
      - name: Build OtaBasic (linked at 0x08010000)
        run: |
          arduino-cli compile --fqbn SeeedJP:Seeed_STM32F4:wioGpsM4 \
            --libraries libraries \
            --build-property build.ldscript=ld/flash.ld \
            --build-property build.vect=VECT_TAB_FLASH \
            --output-dir out \
            libraries/WioOTA/examples/OtaBasic
          ls -l out
      - name: Check vector table
        run: |
          # word 1 (reset handler) must point into 0x0801xxxx..0x0807xxxx
          od -A n -t x4 -N 8 out/OtaBasic.ino.bin
          od -A n -t x4 -j 4 -N 4 out/OtaBasic.ino.bin | grep -Eq ' 080[1-7]'
      - name: Build OtaDiag (WioLTE AT trace on USB serial, millis-stamped)
        run: |
          # Copy the WioLTE library and stamp each Debug::Print line with millis().
          src=$(dirname "$(find ~/Arduino/libraries -name WioLTE.h -path '*src*' | head -1)")
          cp -r "$(dirname "$src")" wiolte-trace
          # Turn the trace on in the copy only (every source includes WioLTEConfig.h first).
          sed -i 's/#include <Arduino.h>/#include <Arduino.h>\n#define WIO_DEBUG/' wiolte-trace/src/WioLTEConfig.h
          grep -q WIO_DEBUG wiolte-trace/src/WioLTEConfig.h
          cat > wiolte-trace/src/Internal/Debug.cpp <<'CPP'
          #include "../WioLTEConfig.h"
          #include "Debug.h"
          #ifdef WIO_DEBUG
          static bool atLineStart = true;
          void Debug::Print(const char* str)
          {
          	for (; *str; str++) {
          		if (atLineStart) { SerialUSB.print('['); SerialUSB.print(millis()); SerialUSB.print("] "); }
          		SerialUSB.print(*str);
          		atLineStart = *str == '\n';
          	}
          }
          void Debug::Println(const char* str) { Print(str); Print("\r\n"); }
          #endif
          CPP
          arduino-cli compile --fqbn SeeedJP:Seeed_STM32F4:wioGpsM4 \
            --library wiolte-trace --libraries libraries \
            --build-property build.ldscript=ld/flash.ld \
            --build-property build.vect=VECT_TAB_FLASH \
            --output-dir out-diag \
            libraries/WioOTA/examples/OtaDiag
          od -A n -t x4 -j 4 -N 4 out-diag/OtaDiag.ino.bin | grep -Eq ' 080[1-7]'
          cp out-diag/OtaDiag.ino.bin out/
      - uses: actions/upload-artifact@v4
        with:
          name: sketch
          path: |
            out/OtaBasic.ino.bin
            out/OtaDiag.ino.bin

  # On main, commit the built binaries into rel/.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [bootloader, sketch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit rel/
        run: |
          mkdir -p rel
          cp artifacts/bootloader/bootloader.bin rel/
          cp artifacts/sketch/OtaBasic.ino.bin artifacts/sketch/OtaDiag.ino.bin rel/
          # One image for a blank board: bootloader at 0x08000000, 0xff up to
          # 0x08010000, then the starter application.
          python3 - <<'PY'
          boot = open('rel/bootloader.bin', 'rb').read()
          app = open('rel/OtaBasic.ino.bin', 'rb').read()
          assert len(boot) <= 0xc000
          open('rel/wiolte-full.bin', 'wb').write(boot + b'\xff' * (0x10000 - len(boot)) + app)
          PY
          git add rel
          if git diff --cached --quiet; then
            echo "rel/ unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rel/ from ${GITHUB_SHA::7}"
          git push

  # On a v* tag, publish a GitHub release with everything a user needs.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bootloader, sketch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release files
        run: |
          set -e
          v=${GITHUB_REF_NAME#v}
          grep -q "^version=$v$" libraries/WioOTA/library.properties || {
            echo "library.properties version does not match tag $GITHUB_REF_NAME"; exit 1; }
          mkdir dist
          cp artifacts/bootloader/bootloader.bin artifacts/sketch/OtaBasic.ino.bin \
             artifacts/sketch/OtaDiag.ino.bin dist/
          python3 - <<'PY'
          boot = open('dist/bootloader.bin', 'rb').read()
          app = open('dist/OtaBasic.ino.bin', 'rb').read()
          assert len(boot) <= 0xc000
          open('dist/wiolte-full.bin', 'wb').write(boot + b'\xff' * (0x10000 - len(boot)) + app)
          PY
          python3 web/make-offline.py && cp web/wiolte-dfu.html dist/
          (cd libraries && zip -qr ../dist/WioOTA-$v.zip WioOTA)
          zip -qj dist/wiolte-server-$v.zip server/index.php server/serial.php server/wiolte-serial
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (tag created from the Releases page).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
